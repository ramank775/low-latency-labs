[package]
name = "ch04-network"
version = "0.1.0"
description = "The networking chapter: the ladder, Nagle, poll vs wait, parsing in place, capture and replay"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The chapter's rustls client (4.8). Off by default: it pulls in a TLS stack and
# a crypto provider that no lab here needs, since the replay leaves the decrypt out.
tls = ["dep:rustls", "dep:webpki-roots"]

[dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
hdrhistogram = { version = "7", default-features = false }
libc = "0.2"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "1", optional = true }
